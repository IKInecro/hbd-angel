<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday Angel</title>
    <!-- Google Font-->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css?v=3" />
  </head>
  <body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>

    <main id="content">
      <div class="card locked" id="card">
        <div class="flip-inner">
          <div class="face front">
            <p class="cover-title">Happy Birthday</p>
            <div class="gate" id="gateForm">
              <label for="code">Masukkan code untuk membuka kartu</label>
              <input id="code" type="password" placeholder="code" autocomplete="off" />
              <button id="buka" class="seal">Buka</button>
              <p id="error"></p>
            </div>
            <p class="cover-ok hidden" id="coverOk">Code benar. Ketuk kartu untuk membuka.</p>
            <div class="cake">
              <div class="top-layer"></div>
              <div class="middle-layer"></div>
              <div class="bottom-layer"></div>
              <div class="candle"></div>
            </div>
          </div>
          <div class="face back">
            <h2>Angel</h2>
            <div class="photos">
              <figure class="polaroid p1"><img src="foto1.png" alt="Foto Angel 1" loading="lazy" /></figure>
              <figure class="polaroid p2"><img src="foto2.png" alt="Foto Angel 2" loading="lazy" /></figure>
              <figure class="polaroid p3"><img src="foto3.png" alt="Foto Angel 3" loading="lazy" /></figure>
            </div>
            <hr class="perf" />
            <p class="msg">Semoga panjang umur dan sehat selalu (anak IT gak punya banyak kata jir)</p>
            <p class="tap-hint">Ketuk kartu untuk membalik</p>
          </div>
        </div>
      </div>

      <audio id="sfx" src="sfxhbd.mp3" preload="auto"></audio>
    </main>

    <script>
      // ponytail: gate client-side, cuma buat kejutan bukan keamanan real. Ganti kode di sini:
      const CODE = "angelcantik";
      const card = document.getElementById("card");
      const input = document.getElementById("code");
      const error = document.getElementById("error");
      const gateForm = document.getElementById("gateForm");
      const coverOk = document.getElementById("coverOk");
      function unlock() {
        if (input.value.trim() === CODE) {
          card.classList.remove("locked");
          card.classList.add("unlocked", "open");
          gateForm.classList.add("hidden");
          coverOk.classList.remove("hidden");
          error.textContent = "";
          document.getElementById("sfx").play().catch(() => {});
        } else {
          error.textContent = "Code salah, coba lagi.";
        }
      }
      document.getElementById("buka").onclick = unlock;
      input.onkeydown = (e) => { if (e.key === "Enter") unlock(); };
      // ketuk = balik kartu. Terkunci = tidak bisa dibuka.
      card.onclick = (e) => {
        if (card.classList.contains("locked")) return;
        if (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON") return;
        card.classList.toggle("open");
      };
    </script>
  </body>
</html>
